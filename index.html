<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Service Cart</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- SERVICES -->

        <section class="services">

            <h1>Car Services</h1>
            <p class="subtitle">Choose a service for your car</p>

            <div class="service-list">

                <div class="service">

                    <div>
                        <h3>Basic Car Wash</h3>
                        <p>₹299</p>
                    </div>

                    <div class="service-action">
                        <input type="number" value="1" min="1">
                        <button class="btn">Add</button>
                    </div>

                </div>


                <div class="service">

                    <div>
                        <h3>Premium Car Wash</h3>
                        <p>₹599</p>
                    </div>

                    <div class="service-action">
                        <input type="number" value="1" min="1">
                        <button class="btn">Add</button>
                    </div>

                </div>


                <div class="service">

                    <div>
                        <h3>Interior Cleaning</h3>
                        <p>₹799</p>
                    </div>

                    <div class="service-action">
                        <input type="number" value="1" min="1">
                        <button class="btn">Add</button>
                    </div>

                </div>


                <div class="service">

                    <div>
                        <h3>Full Car Detailing</h3>
                        <p>₹1499</p>
                    </div>

                    <div class="service-action">
                        <input type="number" value="1" min="1">
                        <button class="btn">Add</button>
                    </div>

                </div>

            </div>

        </section>


        <!-- CART -->

        <aside class="cart">
    <div class="cart-header">
        <h2>Your Cart</h2>
    </div>

    <!-- yahan JS naye cart items dalega -->

</aside>

    </div>


    <script src="script.js"></script>

</body>

</html>
